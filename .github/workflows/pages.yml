# Construit le site multipage (dist/) et le publie sur GitHub Pages à chaque push sur main.
# Domaine : andriharisoa.xyz (fichier CNAME généré par le build, domaine déclaré dans les réglages Pages).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build (pages, SEO, CSP, sitemap, CNAME)
        run: node scripts/build.mjs

      - name: Vérifier le site généré
        run: |
          for page in index.html a-propos/index.html competences/index.html projets/index.html contact/index.html 404.html; do
            test -f "dist/$page" || { echo "Page manquante : $page"; exit 1; }
          done
          test "$(ls -d dist/projets/*/ | wc -l)" -ge 6
          test "$(cat dist/CNAME)" = "andriharisoa.xyz"
          grep -q 'rel="canonical" href="https://andriharisoa.xyz/"' dist/index.html
          grep -q 'http-equiv="Content-Security-Policy"' dist/index.html
          grep -q '<loc>https://andriharisoa.xyz/projets/' dist/sitemap.xml

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
